services:
  xarm:
    image: danielwang123321/uf-ubuntu-docker 
    container_name: xarm
    stdin_open: true    # -i
    tty: true           # -t
    restart: unless-stopped
    networks:
      - proxynet
    ports:
      # web ui
      - "18333:18333"
      # modbus tcp ports
      - "502:502"
      - "503:503"
      - "504:504"
      # sdk tcp ports
      - "30000:30000"
      - "30001:30001"
      - "30002:30002"
      - "30003:30003"
networks:
  proxynet:
    name: proxynet
    external: true
